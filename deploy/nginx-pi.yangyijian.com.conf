# pi.yangyijian.com 反代配置（M-DEPLOY 批②）
# 安装：备份现有 → cp 到 /etc/nginx/sites-available/pi.yangyijian.com → ln -s 到 sites-enabled → nginx -t → reload
# TLS：certbot（runbook §5；若现有证书未含 pi. SAN 则 certbot --expand）
server {
    listen 443 ssl http2;
    server_name pi.yangyijian.com;

    # 证书路径按 certbot 实况（/etc/letsencrypt/live/<名>/fullchain.pem）
    ssl_certificate     /etc/letsencrypt/live/yangyijian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yangyijian.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 单用户小上传面（prompt/editor 文本）；1m 足够
    client_max_body_size 1m;

    # HSTS（单用户自用；确认稳定后可加 preload——不加，避免误锁）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # WS + HTTP 同源反代（server 单端口同源 upgrade——composition staticDir 模式）
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 长连接超时（默认 60s 会踢空闲会话；读会话静默期长）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 80 → 443（certbot 自动生成段；显式列出防遗漏）
server {
    listen 80;
    server_name pi.yangyijian.com;
    return 301 https://$host$request_uri;
}
